[project]
name = "landscape-data-pipeline"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.5",
    "python-dotenv==1.1.1",
    "flask==3.1.2",
    "flask-cors==6.0.1",
]

[tool.vercel]
entrypoint = "api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
